name: FM-1 Target Diagnostic
on:
  push:
    branches: [main]
  pull_request:

env:
  FELUCCA_REF: a53ecf428c29c780108fd70a31b71a32a6b5c313

jobs:
  jieli-target-link:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Fetch pinned Felucca HAL reference
        run: |
          git init /tmp/felucca
          git -C /tmp/felucca remote add origin https://github.com/hugelton/Felucca.git
          git -C /tmp/felucca fetch --depth 1 origin "$FELUCCA_REF"
          git -C /tmp/felucca checkout --detach FETCH_HEAD
          test "$(git -C /tmp/felucca rev-parse HEAD)" = "$FELUCCA_REF"

      - name: Install JieLi pi32v2 toolchain
        run: |
          sh /tmp/felucca/tools/get_toolchain.sh /tmp/jieli
          test -x /tmp/jieli/toolchain/pi32v2/bin/clang
          /tmp/jieli/toolchain/pi32v2/bin/clang --version || true

      - name: Build standalone non-installable FM-1 input diagnostic image
        env:
          FELUCCA_SRC: /tmp/felucca
          JIELI_TOOLCHAIN: /tmp/jieli/toolchain
        run: |
          python3 -m py_compile scripts/build_felucca_diag.py
          python3 scripts/build_felucca_diag.py

      - name: Build autonomous core audio budget diagnostic
        env:
          FELUCCA_SRC: /tmp/felucca
          JIELI_TOOLCHAIN: /tmp/jieli/toolchain
        run: python3 scripts/build_felucca_diag.py --audio-check

      - name: Build full Studio audio stress diagnostic
        env:
          FELUCCA_SRC: /tmp/felucca
          JIELI_TOOLCHAIN: /tmp/jieli/toolchain
        run: |
          python3 -m py_compile scripts/build_felucca_studio_stress.py
          python3 scripts/build_felucca_studio_stress.py

      - name: Build full Studio synth link check with synthetic control map
        env:
          FELUCCA_SRC: /tmp/felucca
          JIELI_TOOLCHAIN: /tmp/jieli/toolchain
        run: python3 scripts/build_felucca_diag.py --synth-check

      - name: Verify target artifacts and safety gates
        run: |
          test -s build/felucca-target/fminimug1-diag.elf
          test -s build/felucca-target/fminimug1-diag.bin
          test -s build/felucca-target/fminimug1-diag.dis
          test -s build/felucca-target/SHA256SUMS
          test -s build/felucca-target/BUILD-INFO.txt
          grep -q '^installable=no$' build/felucca-target/BUILD-INFO.txt
          grep -q '^flash_write_api=disabled$' build/felucca-target/BUILD-INFO.txt
          grep -q '^control_map=raw-diagnostic$' build/felucca-target/BUILD-INFO.txt

          test -s build/felucca-target/fminimug1-audio-check.elf
          test -s build/felucca-target/fminimug1-audio-check.bin
          test -s build/felucca-target/fminimug1-audio-check.dis
          test -s build/felucca-target/AUDIO-CHECK-SHA256SUMS
          test -s build/felucca-target/AUDIO-CHECK-INFO.txt
          grep -q '^installable=no$' build/felucca-target/AUDIO-CHECK-INFO.txt
          grep -q '^flash_write_api=disabled$' build/felucca-target/AUDIO-CHECK-INFO.txt
          grep -q '^control_map=not-required-audio-diagnostic$' build/felucca-target/AUDIO-CHECK-INFO.txt
          grep -q '^audio_budget_ticks=69632$' build/felucca-target/AUDIO-CHECK-INFO.txt

          test -s build/felucca-target/fminimug1-studio-stress.elf
          test -s build/felucca-target/fminimug1-studio-stress.bin
          test -s build/felucca-target/fminimug1-studio-stress.dis
          test -s build/felucca-target/STUDIO-STRESS-SHA256SUMS
          test -s build/felucca-target/STUDIO-STRESS-INFO.txt
          grep -q '^installable=no$' build/felucca-target/STUDIO-STRESS-INFO.txt
          grep -q '^flash_write_api=disabled$' build/felucca-target/STUDIO-STRESS-INFO.txt
          grep -q '^control_map=not-required-studio-stress$' build/felucca-target/STUDIO-STRESS-INFO.txt
          grep -q '^audio_budget_ticks=69632$' build/felucca-target/STUDIO-STRESS-INFO.txt
          grep -q '^load=A-2x+B-1x+drums+character+2048-delay$' build/felucca-target/STUDIO-STRESS-INFO.txt

          test -s build/felucca-target/fminimug1-synth-check.elf
          test -s build/felucca-target/fminimug1-synth-check.bin
          test -s build/felucca-target/fminimug1-synth-check.dis
          test -s build/felucca-target/SYNTH-CHECK-SHA256SUMS
          test -s build/felucca-target/SYNTH-CHECK-INFO.txt
          grep -q '^installable=no$' build/felucca-target/SYNTH-CHECK-INFO.txt
          grep -q '^flash_write_api=disabled$' build/felucca-target/SYNTH-CHECK-INFO.txt
          grep -q '^control_map=synthetic-not-for-hardware$' build/felucca-target/SYNTH-CHECK-INFO.txt
          grep -q '^studio_beta=yes$' build/felucca-target/SYNTH-CHECK-INFO.txt

          if find build/felucca-target -type f -name '*.fwsc' | grep -q .; then
            echo 'safety failure: target link check generated an install package' >&2
            exit 1
          fi

      - name: Write hardware beta warning
        run: |
          cat > build/felucca-target/HARDWARE-BETA-WARNING.txt <<'EOF'
          FMiniMug1 HARDWARE BETA / DIAGNOSTIC ARTIFACTS
          =================================================
          These files are NOT installable firmware packages.
          They are NOT declared safe to flash.
          Flash writes inside FMiniMug1 remain disabled.
          The synth-check binary uses SYNTHETIC control IDs and must NOT be
          treated as the real FM-1 button/encoder map.

          Test order:
          1. raw fminimug1-diag.bin: capture real control IDs
          2. fminimug1-audio-check.bin: baseline core timing; OVER must stay 0
          3. fminimug1-studio-stress.bin: A 2x + B 1x + drums + delay; OVER must stay 0
          4. rebuild mapped Studio runtime with the captured IDs
          5. only then test the full controlled synth on a physical unit

          No .fwsc is intentionally produced.
          EOF

      - name: Print target build summaries
        run: |
          cat build/felucca-target/BUILD-INFO.txt
          echo '---'
          cat build/felucca-target/AUDIO-CHECK-INFO.txt
          echo '---'
          cat build/felucca-target/STUDIO-STRESS-INFO.txt
          echo '---'
          cat build/felucca-target/SYNTH-CHECK-INFO.txt

      - name: Upload non-installable FM-1 hardware beta diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: FMiniMug1-hardware-beta-NON-INSTALLABLE
          path: |
            build/felucca-target/fminimug1-diag.bin
            build/felucca-target/fminimug1-diag.elf
            build/felucca-target/fminimug1-diag.dis
            build/felucca-target/fminimug1-audio-check.bin
            build/felucca-target/fminimug1-audio-check.elf
            build/felucca-target/fminimug1-audio-check.dis
            build/felucca-target/fminimug1-studio-stress.bin
            build/felucca-target/fminimug1-studio-stress.elf
            build/felucca-target/fminimug1-studio-stress.dis
            build/felucca-target/fminimug1-synth-check.bin
            build/felucca-target/fminimug1-synth-check.elf
            build/felucca-target/fminimug1-synth-check.dis
            build/felucca-target/BUILD-INFO.txt
            build/felucca-target/AUDIO-CHECK-INFO.txt
            build/felucca-target/STUDIO-STRESS-INFO.txt
            build/felucca-target/SYNTH-CHECK-INFO.txt
            build/felucca-target/SHA256SUMS
            build/felucca-target/AUDIO-CHECK-SHA256SUMS
            build/felucca-target/STUDIO-STRESS-SHA256SUMS
            build/felucca-target/SYNTH-CHECK-SHA256SUMS
            build/felucca-target/HARDWARE-BETA-WARNING.txt
          retention-days: 14
