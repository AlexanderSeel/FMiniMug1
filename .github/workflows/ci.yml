name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify generated parameter protocol
        working-directory: .
        run: |
          python3 scripts/generate_params.py
          git diff --exit-code -- firmware/include/fm_params.h web/src/generated/params.ts
      - name: Install Emscripten
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y emscripten
      - run: npm install
      - name: Build native WASM + web app
        run: npm run build
      - name: Verify native DSP web artifacts
        run: |
          test -s public/dsp/fminimug1.wasm
          test -s public/dsp/fminimug1-worklet.js
          test -s dist/dsp/fminimug1.wasm
          test -s dist/dsp/fminimug1-worklet.js

  portable-native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify generated parameter protocol
        run: |
          python3 scripts/generate_params.py
          git diff --exit-code -- firmware/include/fm_params.h web/src/generated/params.ts
      - name: Compile portable DSP, sequencer, browser ABI and UI
        run: |
          mkdir -p build
          cc -std=c11 -Wall -Wextra -Werror -Ifirmware/include -c firmware/src/fm_voice.c -o build/fm_voice.o
          cc -std=c11 -Wall -Wextra -Werror -Ifirmware/include -c firmware/src/fm_seq.c -o build/fm_seq.o
          cc -std=c11 -Wall -Wextra -Werror -Ifirmware/include -c firmware/wasm/fm_voice_wasm.c -o build/fm_voice_wasm.o
          cc -std=c11 -Wall -Wextra -Werror -Ifirmware/include -c firmware/src/fm_ui.c -o build/fm_ui.o
      - name: Run DSP stability tests
        run: |
          cc -std=c11 -Wall -Wextra -Werror -Ifirmware/include firmware/src/fm_voice.c tests/test_dsp.c -lm -o build/test_dsp
          ./build/test_dsp
      - name: Run sequencer timing tests
        run: |
          cc -std=c11 -Wall -Wextra -Werror -Ifirmware/include firmware/src/fm_seq.c tests/test_seq.c -o build/test_seq
          ./build/test_seq
      - name: Run UI interaction tests
        run: |
          cc -std=c11 -Wall -Wextra -Werror -Ifirmware/include firmware/src/fm_voice.c firmware/src/fm_ui.c tests/test_ui.c -lm -o build/test_ui
          ./build/test_ui
