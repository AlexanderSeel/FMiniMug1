name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify generated protocols and workstation UI
        working-directory: .
        run: |
          python3 scripts/generate_params.py
          python3 scripts/generate_workstation.py
          git diff --exit-code -- firmware/include/fm_params.h web/src/generated/params.ts firmware/include/fm_workstation_ui.h web/src/generated/workstation.ts
      - name: Install Emscripten
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y emscripten
      - run: npm install
      - name: Build native WASM + web app
        run: npm run build
      - name: Verify native DSP web artifacts
        run: |
          test -s public/dsp/fminimug1.wasm
          test -s public/dsp/fminimug1-worklet.js
          test -s dist/dsp/fminimug1.wasm
          test -s dist/dsp/fminimug1-worklet.js

  portable-native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify generated protocols and workstation UI
        run: |
          python3 scripts/generate_params.py
          python3 scripts/generate_workstation.py
          git diff --exit-code -- firmware/include/fm_params.h web/src/generated/params.ts firmware/include/fm_workstation_ui.h web/src/generated/workstation.ts
      - name: Compile portable DSP, workstation state, sequencer, FX, Studio, app, diagnostics, browser ABI and UI
        run: |
          mkdir -p build
          cc -std=c11 -Wall -Wextra -Werror -Ifirmware/include -c firmware/src/fm_voice.c -o build/fm_voice.o
          cc -std=c11 -Wall -Wextra -Werror -Ifirmware/include -c firmware/src/fm_bass808.c -o build/fm_bass808.o
          cc -std=c11 -Wall -Wextra -Werror -Ifirmware/include -c firmware/src/fm_drum808.c -o build/fm_drum808.o
          cc -std=c11 -Wall -Wextra -Werror -Ifirmware/include -c firmware/src/fm_alpha.c -o build/fm_alpha.o
          cc -std=c11 -Wall -Wextra -Werror -Ifirmware/include -c firmware/src/fm_workstation_state.c -o build/fm_workstation_state.o
          cc -std=c11 -Wall -Wextra -Werror -Ifirmware/include -c firmware/src/fm_workstation_seq.c -o build/fm_workstation_seq.o
          cc -std=c11 -Wall -Wextra -Werror -Ifirmware/include -c firmware/src/fm_workstation_fx.c -o build/fm_workstation_fx.o
          cc -std=c11 -Wall -Wextra -Werror -Ifirmware/include -c firmware/src/fm_seq.c -o build/fm_seq.o
          cc -std=c11 -Wall -Wextra -Werror -Ifirmware/include -c firmware/src/fm_ui.c -o build/fm_ui.o
          cc -std=c11 -Wall -Wextra -Werror -Ifirmware/include -c firmware/src/fm_studio.c -o build/fm_studio.o
          cc -std=c11 -Wall -Wextra -Werror -Ifirmware/include -c firmware/src/fm_app.c -o build/fm_app.o
          cc -std=c11 -Wall -Wextra -Werror -Ifirmware/include -c firmware/src/fm_diag.c -o build/fm_diag.o
          cc -std=c11 -Wall -Wextra -Werror -Ifirmware/include -c firmware/wasm/fm_voice_wasm.c -o build/fm_voice_wasm.o
      - name: Verify DSP hot path has no libm dependencies
        run: |
          if nm -u build/fm_voice.o build/fm_studio.o build/fm_bass808.o build/fm_drum808.o build/fm_alpha.o build/fm_workstation_seq.o build/fm_workstation_fx.o | grep -E '[[:space:]](powf|expf|tanf|pow|exp|tan)$'; then
            echo 'unexpected libm dependency in portable real-time DSP' >&2
            exit 1
          fi
      - name: Compile-check Felucca target adapter with host HAL stubs
        run: |
          INC='-Itests/felucca_stub -Ifirmware/include -Ifirmware/target/felucca'
          cc -std=c11 -Wall -Wextra -Werror $INC -c firmware/target/felucca/fm1_platform_felucca.c -o build/fm1_platform_felucca.o
          cc -std=c11 -Wall -Wextra -Werror $INC -c firmware/target/felucca/fm1_lcd_bridge.c -o build/fm1_lcd_bridge.o
          cc -std=c11 -Wall -Wextra -Werror $INC -c firmware/target/felucca/fm1_bootstrap.c -o build/fm1_bootstrap.o
          cc -std=c11 -Wall -Wextra -Werror $INC -c firmware/target/felucca/fm1_target_main.c -o build/fm1_target_main.o

          AUDIO='-DFMM_TARGET_DIAGNOSTIC=0 -DFMM_TARGET_AUDIO_DIAGNOSTIC=1'
          cc -std=c11 -Wall -Wextra -Werror $INC $AUDIO -c firmware/target/felucca/fm1_target_main.c -o build/fm1_target_main_audio.o

          MAP='-DFMM_BUTTON_MAP_VERIFIED -DFMM_TARGET_DIAGNOSTIC=0 -DFMM_TARGET_AUDIO_DIAGNOSTIC=0 -DFMM_BTN_RAW_OCT_DOWN=0 -DFMM_BTN_RAW_OCT_UP=1 -DFMM_BTN_RAW_PAGE_LEFT=2 -DFMM_BTN_RAW_PAGE_RIGHT=3 -DFMM_BTN_RAW_PRESET=4 -DFMM_BTN_RAW_PATTERN=5 -DFMM_BTN_RAW_PLAY=6 -DFMM_BTN_RAW_HOLD=7 -DFMM_BTN_RAW_ENC1=8 -DFMM_BTN_RAW_ENC2=9 -DFMM_BTN_RAW_ENC3=10 -DFMM_BTN_RAW_ENC4=11 -DFMM_ENC_RAW_1=0 -DFMM_ENC_RAW_2=1 -DFMM_ENC_RAW_3=2 -DFMM_ENC_RAW_4=3'
          cc -std=c11 -Wall -Wextra -Werror $INC $MAP -c firmware/target/felucca/fm1_platform_felucca.c -o build/fm1_platform_felucca_mapped.o
          cc -std=c11 -Wall -Wextra -Werror $INC $MAP -c firmware/target/felucca/fm1_target_main.c -o build/fm1_target_main_mapped.o
      - name: Run Felucca target adapter behavior tests
        run: |
          INC='-Itests/felucca_stub -Ifirmware/include -Ifirmware/target/felucca'
          cc -std=c11 -Wall -Wextra -Werror $INC firmware/target/felucca/fm1_platform_felucca.c tests/test_felucca_platform.c -o build/test_felucca_raw
          ./build/test_felucca_raw

          MAP='-DFMM_BUTTON_MAP_VERIFIED -DFMM_BTN_RAW_OCT_DOWN=0 -DFMM_BTN_RAW_OCT_UP=1 -DFMM_BTN_RAW_PAGE_LEFT=2 -DFMM_BTN_RAW_PAGE_RIGHT=3 -DFMM_BTN_RAW_PRESET=4 -DFMM_BTN_RAW_PATTERN=5 -DFMM_BTN_RAW_PLAY=6 -DFMM_BTN_RAW_HOLD=7 -DFMM_BTN_RAW_ENC1=8 -DFMM_BTN_RAW_ENC2=9 -DFMM_BTN_RAW_ENC3=10 -DFMM_BTN_RAW_ENC4=11 -DFMM_ENC_RAW_1=0 -DFMM_ENC_RAW_2=1 -DFMM_ENC_RAW_3=2 -DFMM_ENC_RAW_4=3'
          cc -std=c11 -Wall -Wextra -Werror $INC $MAP firmware/target/felucca/fm1_platform_felucca.c tests/test_felucca_platform.c -o build/test_felucca_mapped
          ./build/test_felucca_mapped
      - name: Run MINI DSP stability, ADSR and mono-priority tests
        run: |
          cc -std=c11 -Wall -Wextra -Werror -Ifirmware/include firmware/src/fm_voice.c tests/test_dsp.c -lm -o build/test_dsp
          ./build/test_dsp
      - name: Run 808 bass DSP accent/slide/stability tests
        run: |
          cc -std=c11 -Wall -Wextra -Werror -Ifirmware/include firmware/src/fm_bass808.c tests/test_bass808.c -lm -o build/test_bass808
          ./build/test_bass808
      - name: Run 808 drum voice and mix stability tests
        run: |
          cc -std=c11 -Wall -Wextra -Werror -Ifirmware/include firmware/src/fm_drum808.c tests/test_drum808.c -lm -o build/test_drum808
          ./build/test_drum808
      - name: Run ALPHA polyphony envelope chorus stability tests
        run: |
          cc -std=c11 -Wall -Wextra -Werror -Ifirmware/include firmware/src/fm_alpha.c tests/test_alpha.c -lm -o build/test_alpha
          ./build/test_alpha
      - name: Run workstation navigation parity tests
        run: |
          cc -std=c11 -Wall -Wextra -Werror -Ifirmware/include firmware/src/fm_workstation_state.c tests/test_workstation_state.c -o build/test_workstation_state
          ./build/test_workstation_state
      - name: Run workstation shared sample-clock tests
        run: |
          cc -std=c11 -Wall -Wextra -Werror -Ifirmware/include firmware/src/fm_workstation_seq.c tests/test_workstation_seq.c -o build/test_workstation_seq
          ./build/test_workstation_seq
      - name: Run workstation FX stability and wet-tail tests
        run: |
          cc -std=c11 -Wall -Wextra -Werror -Ifirmware/include firmware/src/fm_workstation_fx.c tests/test_workstation_fx.c -lm -o build/test_workstation_fx
          ./build/test_workstation_fx
      - name: Run sequencer timing tests
        run: |
          cc -std=c11 -Wall -Wextra -Werror -Ifirmware/include firmware/src/fm_seq.c tests/test_seq.c -o build/test_seq
          ./build/test_seq
      - name: Run UI interaction tests
        run: |
          cc -std=c11 -Wall -Wextra -Werror -Ifirmware/include firmware/src/fm_voice.c firmware/src/fm_ui.c tests/test_ui.c -o build/test_ui
          ./build/test_ui
      - name: Run portable application runtime tests
        run: |
          cc -std=c11 -Wall -Wextra -Werror -Ifirmware/include firmware/src/fm_voice.c firmware/src/fm_seq.c firmware/src/fm_ui.c firmware/src/fm_studio.c firmware/src/fm_app.c tests/test_app.c -o build/test_app
          ./build/test_app
